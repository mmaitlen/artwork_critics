name: CD

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        run: npm --prefix functions install

      # Skipped if FIREBASE_TOKEN secret is not configured.
      # To enable: run `firebase login:ci` locally and add the printed token
      # as a GitHub secret named FIREBASE_TOKEN.
      # GitHub repo → Settings → Secrets and variables → Actions → New secret
      - name: Deploy to Firebase
        if: ${{ env.FIREBASE_TOKEN != '' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting,functions --project artwork-critique
