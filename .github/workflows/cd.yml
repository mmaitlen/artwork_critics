name: CD

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release

      # ----------------------------------------------------------------
      # Firebase deploy — requires two GitHub secrets to be configured:
      #
      #   FIREBASE_TOKEN      — from: firebase login:ci  (run locally)
      #   FIREBASE_PROJECT_ID — your Firebase project ID (e.g. artwork-critics-12345)
      #
      # Add secrets at: GitHub repo → Settings → Secrets and variables → Actions
      # Uncomment this step after Firebase project is initialized.
      # ----------------------------------------------------------------
      # - name: Deploy to Firebase Hosting
      #   uses: FirebaseExtended/action-hosting-deploy@v0
      #   with:
      #     repoToken: ${{ secrets.GITHUB_TOKEN }}
      #     firebaseServiceAccount: ${{ secrets.FIREBASE_TOKEN }}
      #     projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
      #     channelId: live
